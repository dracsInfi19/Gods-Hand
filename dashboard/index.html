<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>GODS HAND // Command Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--g:rgba(8,13,22,.82);--bd:rgba(34,211,238,.22);--tx:#e6f1f7;--mut:#7f95a6;--cy:#22d3ee;--rd:#ff3b4e;--or:#ff9a3d;--yl:#f2c94c;--gr:#34d399}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px/1.45 system-ui,Segoe UI,sans-serif;color:var(--tx);background:#05080d;overflow:hidden}
#map{position:absolute;inset:0}.dark-tiles{filter:invert(1) hue-rotate(185deg) brightness(.85) contrast(.95) saturate(.6)}
.fx{position:absolute;inset:0;z-index:500;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(2,6,12,.75)),repeating-linear-gradient(0deg,rgba(34,211,238,.035) 0 1px,transparent 1px 4px)}
.glass{position:absolute;z-index:1000;background:var(--g);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:14px;box-shadow:0 0 28px rgba(34,211,238,.08),0 12px 40px rgba(0,0,0,.55)}
.top{top:12px;left:12px;right:12px;display:flex;align-items:center;gap:12px;padding:9px 14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.16em;font-size:14px;color:var(--cy);text-shadow:0 0 14px rgba(34,211,238,.6)}.brand small{display:block;color:var(--mut);letter-spacing:.14em;font-size:9.5px;font-weight:600}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0}
button{font:600 11.5px system-ui;letter-spacing:.07em;text-transform:uppercase;color:var(--tx);background:rgba(34,211,238,.07);border:1px solid var(--bd);border-radius:9px;padding:8px 13px;cursor:pointer}
button:hover{background:rgba(34,211,238,.18)}button.on{background:var(--cy);color:#04141a}button.red{background:var(--rd);border-color:var(--rd);color:#fff}
.badge{background:var(--rd);color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px;font-size:11px}
.chips{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}.chip{padding:3px 11px;border-left:2px solid var(--cy)}.chip b{display:block;font-size:17px;line-height:1.1}.chip span{font-size:9.5px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.clock{font:600 13px ui-monospace,Menlo,monospace;color:var(--cy)}
.bottom{left:50%;transform:translateX(-50%);bottom:12px;width:min(720px,calc(100% - 24px));padding:9px 14px;display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;accent-color:var(--cy)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut)}
.drawer{top:72px;bottom:72px;right:12px;width:370px;overflow:auto;padding:14px;transform:translateX(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:1200}.drawer.open{transform:none}
h2{margin:0 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cy);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:11px;margin-bottom:8px;cursor:pointer;background:rgba(255,255,255,.025)}.row:hover{background:rgba(34,211,238,.1)}
.rk{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.bar{height:4px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%}
.card{top:72px;left:12px;bottom:72px;width:380px;overflow:auto;padding:0;transform:translateX(-110%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}.card.open{transform:none}
.ch{padding:14px 16px;border-bottom:1px solid var(--bd);background:linear-gradient(135deg,rgba(255,59,78,.28),transparent)}
.ch .al{font:800 10.5px system-ui;letter-spacing:.2em;color:var(--rd);display:flex;gap:8px;align-items:center}.ch .al:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rd);animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.ch h3{margin:6px 0 2px;font-size:20px}.sec{padding:12px 16px;border-bottom:1px solid var(--bd)}.sec h4{margin:0 0 8px;font-size:10px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;margin:2px 4px 2px 0;border:1px solid}
.pri{float:right;font:800 26px ui-monospace,monospace}.x{position:absolute;top:10px;right:12px;padding:3px 9px}
.pin{position:relative;width:34px;height:34px}.pin i{position:absolute;inset:0;background:var(--c);border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 0 20px var(--c)}.pin b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#fff;z-index:2;padding-bottom:3px}
.pin u{position:absolute;left:-8px;top:6px;width:50px;height:50px;border-radius:50%;border:2px solid var(--c);animation:pu 1.8s infinite;opacity:0}@keyframes pu{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.nd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 10.5px system-ui;border:2px solid #04141a;box-shadow:0 0 12px currentColor}
.toast{position:absolute;z-index:1500;top:76px;left:50%;transform:translate(-50%,-30px);opacity:0;background:var(--rd);padding:10px 22px;border-radius:12px;font-weight:800;letter-spacing:.12em;box-shadow:0 0 40px rgba(255,59,78,.7);transition:.35s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.loc{top:72px;right:12px;width:280px;padding:14px;display:none;z-index:1300}.loc.on{display:block}.loc input{width:100%;margin:4px 0 8px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:rgba(255,255,255,.06);color:var(--tx)}
.coord{right:12px;bottom:72px;padding:6px 11px;font:11px ui-monospace,monospace;color:var(--mut)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0a1220;color:var(--tx);border:1px solid var(--bd)}.leaflet-control-layers,.leaflet-bar a{background:#0a1220!important;color:var(--tx)!important;border-color:var(--bd)!important}
@media(max-width:900px){.card{width:auto;right:12px;top:auto;height:55%}.drawer{width:auto;left:12px}.coord{display:none}}
</style></head><body>
<div id="map"></div><div class="fx"></div><div class="toast" id="toast"></div>
<div class="glass top"><div class="brand">GODS HAND<small>FLOOD RESCUE // COMMAND CENTER</small></div>
<div class="seg"><button id="mE" class="on">Emergency</button><button id="mM">Mesh network</button></div>
<button id="qb" class="red">Priority queue<span class="badge" id="qn">0</span></button>
<div class="chips"><div class="chip"><b id="s1">0</b><span>Nodes online</span></div><div class="chip"><b id="s2">0</b><span>Lost</span></div><div class="chip"><b id="s3" style="color:var(--rd)">0</b><span>Critical</span></div><div class="chip"><b id="s4" style="color:var(--gr)">0</b><span>Dispatch</span></div></div>
<button id="locb">📍 Location</button><div class="clock" id="clk"></div></div>
<div class="glass card" id="card"></div>
<aside class="glass drawer" id="dr"><h2>SOS queue · by priority <button onclick="dr.classList.remove('open')">Close</button></h2><div id="ql"></div></aside>
<div class="glass loc" id="loc"><h2>Map origin</h2><label class="mono">Latitude</label><input id="lat"><label class="mono">Longitude</label><input id="lon"><div style="display:flex;gap:8px"><button class="on" id="apply">Apply</button><button id="me">My location</button></div></div>
<div class="glass coord" id="cur">cursor</div>
<div class="glass bottom"><button id="play">Pause</button><button id="rep">Replay</button><input id="sl" type="range" min="0" value="0"><span class="mono" id="tl"></span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const R=6371000,PC={red:"#ff3b4e",orange:"#ff9a3d",yellow:"#f2c94c"},$=id=>document.getElementById(id),dr=$("dr"),rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
const CAUSE={medical:"Medical emergency",trapped:"Trapped, cannot evacuate",supplies:"Needs food / water supplies"};
let O={lat:10.0,lon:76.3};try{O=JSON.parse(localStorage.getItem("origin"))||O}catch(e){}
const ll=(x,y)=>[O.lat+deg(y/R),O.lon+deg(x/(R*Math.cos(rad(O.lat))))],fmt=p=>p[0].toFixed(6)+", "+p[1].toFixed(6),T0=Date.now();
const clock=t=>new Date(T0+t*1000).toLocaleTimeString("en-GB");
const map=L.map("map",{zoomControl:false}).setView([O.lat,O.lon],15),OSM="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const tl={"Dark":L.tileLayer(OSM,{maxZoom:19,className:"dark-tiles",attribution:"© OpenStreetMap"}),"Streets":L.tileLayer(OSM,{maxZoom:19,attribution:"© OpenStreetMap"}),"Satellite":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"})};
tl.Dark.addTo(map);L.control.layers(tl,null,{position:"topright"}).addTo(map);L.control.zoom({position:"topright"}).addTo(map);L.control.scale({imperial:false}).addTo(map);
map.on("mousemove",e=>$("cur").textContent=e.latlng.lat.toFixed(6)+"  "+e.latlng.lng.toFixed(6));
const G=L.layerGroup().addTo(map),PK=L.layerGroup().addTo(map);
let F=[],REG={},i=0,last=-1,playing=true,mode="E",known=new Set(),queue=[],busy=false,cur=null,pk=[];
const ico=(h,s,a)=>L.divIcon({className:"",html:h,iconSize:[s,s],iconAnchor:a||[s/2,s/2]});
const reg=n=>REG[n]||{serial:"UNREGISTERED",name:"Unknown",age:"-",sex:"",phone:"-",address:"-",blood:"-",notes:"-",contact:"-"};
Promise.all([fetch("frames.json").then(r=>r.json()),fetch("registry.json").then(r=>r.json()).catch(()=>({}))]).then(([f,r])=>{F=f;REG=r;$("sl").max=F.length-1;fit();go(0);setInterval(()=>{if(playing)go((i+1)%F.length)},1100);requestAnimationFrame(anim)}).catch(()=>$("tl").textContent="frames.json missing: run START_HERE.bat");
function fit(){const f=F[F.length-1],p=[ll(0,0)];f.nodes.forEach(n=>n.pos&&p.push(ll(...n.pos)));map.fitBounds(L.latLngBounds(p).pad(.3))}
const bat=b=>b>=60?["Good","#34d399"]:b>=30?["Fair","#f2c94c"]:b>=15?["Low","#ff9a3d"]:["Critical","#ff3b4e"];
const hops=(f,n)=>{const r=f.routes[n];return r?r.path.map(x=>x===0?"GW":"#"+x).join(" → "):"no route (cut off)"};
function showCard(n){cur=n;const f=F[i],q=f.sos.find(s=>s.node===n);if(!q)return;const r=reg(n),c=ll(...q.pos),[bl,bc]=bat(q.battery);
$("card").innerHTML=`<div class="ch"><button class="x" onclick="cur=null;card.classList.remove('open')">✕</button><div class="al">SOS ALERT · ${q.decision.replace(/_/g," ")}</div><h3>${r.name}<span class="pri" style="color:${PC[q.color]}">${q.priority}</span></h3><div class="mono">PRIORITY SCORE · ${q.color.toUpperCase()}</div></div>
<div class="sec"><h4>Cause of SOS</h4><div style="font-size:15px;font-weight:700;margin-bottom:6px">${CAUSE[q.kind]||q.kind}</div>${q.flags.map(x=>`<span class="tag" style="color:var(--or)">${x}</span>`).join("")}<span class="tag" style="color:var(--cy)">presses ${q.presses}</span><span class="tag" style="color:var(--mut)">device ${q.motion}</span></div>
<div class="sec"><h4>Person details</h4><div class="kv"><span>Name</span><span>${r.name}</span></div><div class="kv"><span>Age / sex</span><span>${r.age} ${r.sex}</span></div><div class="kv"><span>Blood group</span><span>${r.blood}</span></div><div class="kv"><span>Medical notes</span><span>${r.notes}</span></div><div class="kv"><span>Phone</span><span>${r.phone}</span></div><div class="kv"><span>Address</span><span>${r.address}</span></div><div class="kv"><span>Emergency contact</span><span>${r.contact}</span></div></div>
<div class="sec"><h4>Hardware device</h4><div class="kv"><span>Serial no.</span><span class="mono" style="color:var(--cy)">${r.serial}</span></div><div class="kv"><span>Node ID</span><span>#${n}</span></div><div class="kv"><span>Battery health</span><span style="color:${bc}">${q.battery}% · ${bl}</span></div><div class="bar"><i style="width:${q.battery}%;background:${bc}"></i></div><div class="kv" style="margin-top:6px"><span>Mesh route</span><span class="mono">${hops(f,n)}</span></div></div>
<div class="sec"><h4>Location</h4><div class="kv"><span>Latitude</span><span class="mono">${c[0].toFixed(6)}</span></div><div class="kv"><span>Longitude</span><span class="mono">${c[1].toFixed(6)}</span></div><div class="kv"><span>GPS</span><span>${q.trusted?"Verified fix":"Last known (weak GPS)"}</span></div><div class="kv"><span>Drone</span><span>${q.drone==="confirmed"?"Person confirmed ✓":"Not yet verified"}</span></div></div>
<div class="sec"><h4>Timing</h4><div class="kv"><span>Pressed at</span><span class="mono">${clock(f.t-q.age_s)}</span></div><div class="kv"><span>Waiting</span><span>${Math.floor(q.age_s/60)} min ${q.age_s%60} s</span></div><div class="kv"><span>Confidence</span><span>${Math.round(q.confidence*100)}%</span></div></div>
<div class="sec" style="display:flex;gap:8px"><button class="red" onclick="this.textContent='Dispatched ✓';this.disabled=true">Dispatch team</button><button onclick="map.flyTo([${c}],18)">Locate</button></div>`;$("card").classList.add("open")}
function fly(n){const q=F[i].sos.find(s=>s.node===n);if(q){map.flyTo(ll(...q.pos),17,{duration:1.4});showCard(n)}}
function pump(){if(busy||!queue.length)return;busy=true;queue.sort((a,b)=>b.p-a.p);const e=queue.shift();$("toast").textContent="🚨 SOS · "+reg(e.n).name.toUpperCase();$("toast").classList.add("on");
try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.25)}catch(x){}
fly(e.n);setTimeout(()=>{$("toast").classList.remove("on")},2600);setTimeout(()=>{busy=false;pump()},3800)}
function go(k){if(k<last){known.clear();queue=[];cur=null;$("card").classList.remove("open")}last=i=k;const f=F[k];$("sl").value=k;$("tl").textContent="t="+f.t+"s";$("clk").textContent=clock(f.t);
const now=new Set(f.sos.map(s=>s.node));known.forEach(n=>{if(!now.has(n))known.delete(n)});f.sos.forEach(s=>{if(!known.has(s.node)){known.add(s.node);queue.push({n:s.node,p:s.priority})}});pump();draw(f)}
function draw(f){G.clearLayers();PK.clearLayers();pk=[];const P={0:[0,0]};f.nodes.forEach(n=>n.pos&&(P[n.id]=n.pos));
L.marker(ll(0,0),{icon:ico('<div class="nd" style="background:#fff;color:#000;width:30px;height:30px;border-radius:8px">GW</div>',30)}).bindPopup("<b>Gateway</b><br>"+fmt(ll(0,0))).addTo(G);
if(mode==="M"){f.links.forEach(([a,b,q])=>{if(P[a]&&P[b])L.polyline([ll(...P[a]),ll(...P[b])],{color:q>=.6?"#34d399":q>=.35?"#f2c94c":"#ff3b4e",weight:1.5+q*3,opacity:.8}).bindTooltip("Link "+(a||"GW")+"–"+(b||"GW")+" · quality "+q).addTo(G)});
if(f.relay){const c=ll(f.relay[0],f.relay[1]);L.circle(c,{radius:450,color:"#22d3ee",weight:2,dashArray:"8 6",fillOpacity:.05}).addTo(G);L.marker(c,{icon:ico('<div class="nd" style="background:#22d3ee;width:30px;height:30px">🚁</div>',30)}).bindPopup("<b>Drone relay point</b><br>"+fmt(c)+"<br>Reconnects nodes "+f.relay[2].join(", ")).addTo(G)}
f.nodes.forEach(n=>{if(!n.pos)return;const c=ll(...n.pos),a=n.state==="ACTIVE",r=reg(n.id),rt=f.routes[n.id];if(!a)L.circle(c,{radius:Math.min(n.uncertainty_m,600),color:"#8b93a1",weight:1,dashArray:"4 4",fillOpacity:.06}).addTo(G);
L.marker(c,{icon:ico(`<div class="nd" style="background:${a?"#22d3ee":"#6b7280"};color:${a?"#22d3ee":"#6b7280"}"><span style="color:#04141a">${n.id}</span></div>`,24)}).bindPopup(`<b>${r.serial}</b><br>${r.name}<br>${n.state} · battery ${n.battery==null?"-":Math.round(n.battery)+"%"}<br>${fmt(c)}<br>Route: ${hops(f,n.id)}`).addTo(G);
if(a&&rt&&rt.path.length>1){const m=L.circleMarker(c,{radius:4,color:"#fff",fillColor:"#fff",fillOpacity:1,weight:0}).addTo(PK);pk.push({m,pts:rt.path.map(x=>ll(...P[x])),o:n.id*.13})}})}
f.clusters.filter(c=>c.people>1).forEach(c=>L.circle(ll(...c.centroid),{radius:60,color:PC[c.color],weight:2,fillOpacity:.1}).bindTooltip(c.people+" people",{permanent:true,direction:"right"}).addTo(G));
f.sos.forEach(q=>{const c=ll(...q.pos),col=PC[q.color];L.marker(c,{icon:ico(`<div class="pin" style="--c:${col}"><u></u><i></i><b>${Math.round(q.priority)}</b></div>`,34,[17,34]),zIndexOffset:900}).on("click",()=>fly(q.node)).bindTooltip(reg(q.node).name,{direction:"top",offset:[0,-34]}).addTo(G)});
const on=f.nodes.filter(n=>n.state==="ACTIVE").length;$("s1").textContent=on;$("s2").textContent=f.nodes.length-on;$("s3").textContent=f.sos.filter(q=>q.priority>=80).length;$("s4").textContent=f.sos.filter(q=>q.decision==="DISPATCH").length;$("qn").textContent=f.sos.length;
$("ql").innerHTML=f.sos.length?f.sos.map((q,k)=>{const r=reg(q.node),[bl,bc]=bat(q.battery);return `<div class="row" onclick="fly(${q.node});dr.classList.remove('open')"><div class="rk" style="background:${PC[q.color]}">${k+1}</div><div><b>${r.name}</b><div class="mono">${r.serial}</div><div class="mono">${CAUSE[q.kind]||q.kind} · <span style="color:${bc}">${q.battery}%</span> · ${Math.floor(q.age_s/60)}m ${q.age_s%60}s</div><div class="bar"><i style="width:${q.priority}%;background:${PC[q.color]}"></i></div></div><div style="font:800 17px ui-monospace,monospace;color:${PC[q.color]}">${Math.round(q.priority)}</div></div>`}).join(""):'<div class="mono">No active SOS</div>';
if(cur!==null)showCard(cur)}
function anim(t){pk.forEach(o=>{const p=o.pts,seg=p.length-1,x=((t/1000/5)+o.o)%1*seg,k=Math.min(Math.floor(x),seg-1),u=x-k;o.m.setLatLng([p[k][0]+(p[k+1][0]-p[k][0])*u,p[k][1]+(p[k+1][1]-p[k][1])*u])});requestAnimationFrame(anim)}
$("mE").onclick=()=>{mode="E";$("mE").classList.add("on");$("mM").classList.remove("on");draw(F[i])};$("mM").onclick=()=>{mode="M";$("mM").classList.add("on");$("mE").classList.remove("on");draw(F[i]);fit()};
$("qb").onclick=()=>dr.classList.toggle("open");$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"Pause":"Play"};
$("rep").onclick=()=>{playing=true;$("play").textContent="Pause";go(0)};$("sl").oninput=e=>{playing=false;$("play").textContent="Play";go(+e.target.value)};
$("locb").onclick=()=>{$("lat").value=O.lat;$("lon").value=O.lon;$("loc").classList.toggle("on")};
$("apply").onclick=()=>{const a=parseFloat($("lat").value),b=parseFloat($("lon").value);if(isFinite(a)&&isFinite(b)&&Math.abs(a)<=90&&Math.abs(b)<=180){O={lat:a,lon:b};try{localStorage.setItem("origin",JSON.stringify(O))}catch(e){}draw(F[i]);fit();$("loc").classList.remove("on")}};
$("me").onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{$("lat").value=p.coords.latitude.toFixed(6);$("lon").value=p.coords.longitude.toFixed(6)});
</script></body></html>
